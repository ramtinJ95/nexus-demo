<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pylon Panic</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%225%22 fill=%22%23ff3df2%22/%3E%3C/svg%3E" />
  </head>
  <body>
    <main class="game" data-testid="game" data-phase="playing">
      <canvas></canvas>
      <div class="hud">
        <div class="stat">
          <span class="label">Score</span>
          <span class="value" data-testid="hud-score">0</span>
        </div>
        <div class="stat">
          <span class="label">Wave</span>
          <span class="value" data-testid="hud-wave">1</span>
          <span class="countdown" data-testid="hud-countdown"></span>
        </div>
        <div class="stat">
          <span class="label">Integrity</span>
          <span class="value" data-testid="hud-integrity">100</span>
          <div class="integrity-track"><div class="integrity-bar" data-testid="hud-integrity-bar"></div></div>
        </div>
        <div class="stat seed">
          <span class="label">Seed</span>
          <span class="value" data-testid="hud-seed"></span>
        </div>
      </div>
      <section class="game-over" data-testid="game-over" hidden>
        <h1>PYLON DOWN</h1>
        <p>Score <strong data-testid="final-score">0</strong></p>
        <p>Wave <strong data-testid="final-wave">1</strong></p>
        <button type="button" data-testid="restart">Restart</button>
        <span class="hint">or press R</span>
      </section>
      <section class="menu" data-testid="title-screen">
        <canvas class="logo" data-testid="title-logo" aria-label="Pylon Panic"></canvas>
        <ul class="how-to-play" data-testid="how-to-play">
          <li><kbd>WASD</kbd> or arrows move</li>
          <li>The mouse aims</li>
          <li>Hold left click to fire</li>
          <li>Keep the bugs off the pylon</li>
          <li><kbd>Esc</kbd> pauses</li>
        </ul>
        <div class="menu-buttons">
          <button type="button" data-testid="start">Start</button>
          <button type="button" data-testid="title-settings">Settings</button>
        </div>
        <span class="hint">or press Enter</span>
      </section>
      <section class="menu" data-testid="pause-overlay" hidden>
        <h1>PAUSED</h1>
        <div class="menu-buttons">
          <button type="button" data-testid="resume">Resume</button>
          <button type="button" data-testid="pause-settings">Settings</button>
        </div>
        <span class="hint">Esc to resume</span>
      </section>
      <section class="menu" data-testid="settings" hidden>
        <h1>SETTINGS</h1>
        <div class="settings-fields">
          <label class="field">
            <span>Volume</span>
            <input type="range" min="0" max="100" step="5" data-testid="setting-volume" />
            <output data-testid="setting-volume-value"></output>
          </label>
          <label class="field">
            <input type="checkbox" data-testid="setting-reduced-motion" />
            <span>Reduced motion</span>
          </label>
          <label class="field">
            <input type="checkbox" data-testid="setting-colorblind" />
            <span>Colorblind-safe colors</span>
          </label>
        </div>
        <button type="button" data-testid="settings-back">Back</button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
